[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "en-core-web-sm",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "preshed==3.0.9",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
    "sqlalchemy>=2",
    "srt>=3.5.3",
    "uvicorn[standard]>=0.54.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
